name: Deploy DeckCraft Web+

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CRAFT_FONTS_REF: 43913056ce82a3fdad0ef69f6b88d1dc922a8104

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout DeckCraft
        uses: actions/checkout@v4

      - name: Checkout presentation fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: web-wasm

      - name: Build optimized browser app
        working-directory: apps/deckcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: trunk build --release

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
